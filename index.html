<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bản đồ TSBĐ &amp; TSSS - BIDV</title>
  <!-- Leaflet styles -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <!-- Screenshoter styles -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet-simple-map-screenshoter@0.5.0/dist/leaflet-simple-map-screenshoter.css"
  />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { width: 100vw; height: 100vh; }
    .controls {
      position: absolute;
      top: 10px;
      left: 60px;
      background-color: rgba(0, 125, 120, 0.9);
      padding: 8px 10px;
      border-radius: 8px;
      color: white;
      z-index: 1000;
      width: 380px;
      max-height: calc(100vh - 20px);
      overflow-y: auto;
      box-sizing: border-box;
    }
    .controls input {
      margin: 4px 0;
      padding: 6px;
      border-radius: 4px;
      border: none;
      width: 100%;
      font-size: 14px;
      box-sizing: border-box;
    }
    .controls button {
      background-color: #f2c94c;
      color: black;
      border: none;
      padding: 6px 12px;
      margin-top: 8px;
      margin-right: 5px;
      border-radius: 4px;
      cursor: pointer;
    }
    .controls.thu-gon .than-bang { display: none; }
    .tieu-de { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .tieu-de .mui { background: #f2c94c; color: #000; border-radius: 4px; padding: 0 8px; font-weight: bold; }
    .muc.thu-gon .noi-dung { display: none; }
    .dong { display: flex; align-items: center; gap: 8px; }
    .dong input { flex: 1; }
    .cong-tac { position: relative; flex: 0 0 40px; width: 40px; height: 22px; }
    .cong-tac input { opacity: 0; width: 0; height: 0; position: absolute; }
    .cong-tac span { position: absolute; inset: 0; background: #9aa5a4; border-radius: 22px; cursor: pointer; transition: .2s; }
    .cong-tac span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .cong-tac input:checked + span { background: #0b6b47; box-shadow: inset 0 0 0 1px #f2c94c; }
    .cong-tac input:checked + span::before { transform: translateX(18px); }
    .diem { margin: 2px 0; }
    .nhan { flex: 0 0 52px; font-weight: bold; font-size: 14px; line-height: 1.1; }
    .kc { display: block; color: #f2c94c; font-size: 11px; font-weight: bold; }
    .dong input { margin: 2px 0; padding: 5px 6px; }
    .controls .nut-dc { padding: 4px 6px; background: #e9f5f4; }
    .controls .nut-dc.bat { background: #f2c94c; }
    .dia-chi { margin-left: 108px; }
    .dia-chi[hidden] { display: none; }
    .dia-chi input { font-size: 13px; background: #e9f5f4; }
    .controls .dia-chi button, .controls .nut-nho { margin-top: 0; padding: 5px 8px; }
    .vn-dong { display: grid; grid-template-columns: 1fr 1fr 26px; gap: 6px; align-items: center; }
    .vn-dong button { margin: 0; padding: 4px 0; background: #e0e0e0; }
    .vn-kq { font-size: 13px; color: #f2c94c; margin: -2px 0 4px; }
    .vn-kq a { color: #fff; margin-left: 6px; cursor: pointer; text-decoration: underline; }
    .controls select { width: 100%; padding: 6px; border-radius: 4px; border: none; margin: 4px 0; }
    .label-icon { display: flex; flex-direction: column; align-items: center; }
    .label-box {
      background-color: #007d78;
      color: #f2c94c;
      font-weight: bold;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: 2px solid #007d78;
      white-space: nowrap;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
      position: relative;
    }
    .label-box::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #007d78;
    }
    .label-img { width: 35px; height: 35px; margin-top: 4px; }
    .tsbd-img { width: 40px; height: 40px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-simple-map-screenshoter@0.5.0/dist/leaflet-simple-map-screenshoter.min.js"></script>

  <script>
    const defaultCenter = [21.02971, 105.85712];
    const map = L.map('map').setView(defaultCenter, 17);

    // Nền bản đồ dữ liệu OpenStreetMap, không cần API key, không dùng Google Maps.
    // tile.openstreetmap.org bị chặn ở một số mạng Việt Nam (nguyên nhân mất nền bản đồ bản cũ),
    // nên mặc định dùng máy chủ cộng đồng OSM France; lỗi nhiều ô thì tự chuyển sang OSM Humanitarian (HOT), rồi OSM gốc.
    const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
    const nenOsmFr = L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      subdomains: 'abc', maxZoom: 20, crossOrigin: true, attribution: OSM_ATTR + ' · nền OSM France'
    });
    const nenHot = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      subdomains: 'abc', maxZoom: 19, crossOrigin: true, attribution: OSM_ATTR + ' · nền Humanitarian (HOT)'
    });
    const nenOsm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, crossOrigin: true, attribution: OSM_ATTR
    });
    const nenVeTinh = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, crossOrigin: true, attribution: 'Ảnh vệ tinh &copy; Esri'
    });
    const chuoiNen = [nenOsmFr, nenHot, nenOsm];
    function dungNen(i) {
      chuoiNen.forEach(l => map.hasLayer(l) && map.removeLayer(l));
      const nen = chuoiNen[i]; let loi = 0;
      nen.off('tileerror').on('tileerror', () => { if (++loi === 6 && i + 1 < chuoiNen.length) dungNen(i + 1); });
      nen.addTo(map);
    }
    dungNen(0);
    L.control.layers({ 'OSM France (mặc định)': nenOsmFr, 'OSM Humanitarian': nenHot, 'OpenStreetMap gốc': nenOsm, 'Ảnh vệ tinh': nenVeTinh }, null, { position: 'bottomright' }).addTo(map);

    const markers = {};

    const screenshoter = L.simpleMapScreenshoter({
      hideElementsWithSelectors: ['.leaflet-control-container', '.controls'],
      preventDownload: true,
      position: 'topright',
    }).addTo(map);

    function calculateDistance(lat1, lon1, lat2, lon2) {
      function toRad(deg) { return (deg * Math.PI) / 180; }
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Number((R * c).toFixed(2));
    }

    function createMarker(id, lat, lng, labelText, imageUrl, isTSBD = false) {
      if (markers[id]) { map.removeLayer(markers[id]); }
      const iconHtml = `
        <div class="label-icon">
          <div class="label-box">${labelText}</div>
          <img src="${imageUrl}" class="${isTSBD ? 'tsbd-img' : 'label-img'}" />
        </div>
      `;
      const icon = L.divIcon({ className:'', html: iconHtml, iconAnchor:[20,50] });
      markers[id] = L.marker([lat, lng], { icon });
      if (dangBat(id)) markers[id].addTo(map);
    }

    // Công tắc bật/tắt từng điểm trên bản đồ + thu gọn bảng/mục; nhớ lựa chọn trong trình duyệt.
    const nho = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
    function dangBat(id) {
      const cb = document.querySelector(`input[data-marker="${id}"]`);
      return !cb || cb.checked;
    }
    document.querySelectorAll('input[data-marker]').forEach(cb => {
      const id = cb.dataset.marker;
      if (nho('bat-' + id) === '0') cb.checked = false;
      cb.addEventListener('change', () => {
        nho('bat-' + id, cb.checked ? '1' : '0');
        const m = markers[id];
        if (!m) return;
        if (cb.checked) m.addTo(map); else map.removeLayer(m);
      });
    });
    document.querySelectorAll('[data-thu]').forEach(td => {
      const khung = document.getElementById(td.dataset.thu);
      const mui = td.querySelector('.mui');
      const dat = thu => { khung.classList.toggle('thu-gon', thu); mui.textContent = thu ? '▸' : '▾'; };
      dat(nho('thu-' + khung.id) === '1');
      td.addEventListener('click', () => { const thu = !khung.classList.contains('thu-gon'); dat(thu); nho('thu-' + khung.id, thu ? '1' : '0'); });
    });

    function updateMarkers() {
      const inputs = {
        tsbd: document.getElementById('tsbd').value,
        tsss1: document.getElementById('tsss1').value,
        tsss2: document.getElementById('tsss2').value,
        tsss3: document.getElementById('tsss3').value,
      };
      let tsbdLat = null, tsbdLng = null;
      const positions = [];
      if (inputs.tsbd) {
        const [lat, lng] = inputs.tsbd.split(',').map(Number);
        tsbdLat = lat; tsbdLng = lng;
        createMarker('tsbd', lat, lng, 'TSBĐ', 'tsbd-marker.svg', true);
        positions.push([lat, lng]);
      }
      function handleTSSS(id, label) {
        if (inputs[id]) {
          const [lat, lng] = inputs[id].split(',').map(Number);
          createMarker(id, lat, lng, label, 'pngtree-circular-world-flag-vietnam-icon-png-image_4830539.png');
          positions.push([lat, lng]);
          if (tsbdLat !== null) {
            const dist = calculateDistance(tsbdLat, tsbdLng, lat, lng);
            document.getElementById(`dist-${id}`).innerText = `${dist} km`;
          }
        } else {
          document.getElementById(`dist-${id}`).innerText = '';
        }
      }
      handleTSSS('tsss1','TSSS 1');
      handleTSSS('tsss2','TSSS 2');
      handleTSSS('tsss3','TSSS 3');
      if (positions.length > 0) { map.fitBounds(positions); }
      (async () => { for (const k of ['tsbd', 'tsss1', 'tsss2', 'tsss3']) if (!document.getElementById(k + '-dong-dc').hidden) await capNhatDiaChi(k); })();
    }

    // VN-2000 (múi chiếu 3°, k0 = 0,9999) sang WGS84 (tọa độ Google). Tham số 7 phép Helmert theo EPSG "VN-2000 to WGS 84 (2)",
    // quy ước coordinate frame. X = tọa độ Bắc, Y = tọa độ Đông (cách ghi của sổ đỏ / bản vẽ Việt Nam).
    function vn2000SangWgs84(X, Y, kinhTuyenTruc, k0 = 0.9999) {
      const a = 6378137, f = 1 / 298.257223563, e2 = f * (2 - f), ep2 = e2 / (1 - e2), rad = Math.PI / 180;
      // 1) Nghịch chiếu Transverse Mercator trên elipxoit WGS84 (VN-2000 dùng cùng elipxoit).
      const M = X / k0, mu = M / (a * (1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256));
      const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
      const p1 = mu + (3 * e1 / 2 - 27 * e1 ** 3 / 32) * Math.sin(2 * mu) + (21 * e1 ** 2 / 16 - 55 * e1 ** 4 / 32) * Math.sin(4 * mu)
        + (151 * e1 ** 3 / 96) * Math.sin(6 * mu) + (1097 * e1 ** 4 / 512) * Math.sin(8 * mu);
      const C1 = ep2 * Math.cos(p1) ** 2, T1 = Math.tan(p1) ** 2, N1 = a / Math.sqrt(1 - e2 * Math.sin(p1) ** 2);
      const R1 = a * (1 - e2) / (1 - e2 * Math.sin(p1) ** 2) ** 1.5, D = (Y - 500000) / (N1 * k0);
      const phi = p1 - (N1 * Math.tan(p1) / R1) * (D ** 2 / 2 - (5 + 3 * T1 + 10 * C1 - 4 * C1 ** 2 - 9 * ep2) * D ** 4 / 24
        + (61 + 90 * T1 + 298 * C1 + 45 * T1 ** 2 - 252 * ep2 - 3 * C1 ** 2) * D ** 6 / 720);
      const lam = kinhTuyenTruc * rad + (D - (1 + 2 * T1 + C1) * D ** 3 / 6
        + (5 - 2 * C1 + 28 * T1 - 3 * C1 ** 2 + 8 * ep2 + 24 * T1 ** 2) * D ** 5 / 120) / Math.cos(p1);
      // 2) Sang tọa độ địa tâm, áp Helmert 7 tham số, đổi ngược về kinh vĩ độ WGS84.
      const N = a / Math.sqrt(1 - e2 * Math.sin(phi) ** 2);
      const x = N * Math.cos(phi) * Math.cos(lam), y = N * Math.cos(phi) * Math.sin(lam), z = N * (1 - e2) * Math.sin(phi);
      const giay = rad / 3600, rx = -0.00928836 * giay, ry = 0.01975479 * giay, rz = -0.00427372 * giay, s = 1 + 0.252906278e-6;
      const X2 = -191.90441429 + s * (x + rz * y - ry * z);
      const Y2 = -39.30318279 + s * (-rz * x + y + rx * z);
      const Z2 = -111.45032835 + s * (ry * x - rx * y + z);
      const pp = Math.hypot(X2, Y2); let lat = Math.atan2(Z2, pp * (1 - e2));
      for (let i = 0; i < 6; i++) { const Ni = a / Math.sqrt(1 - e2 * Math.sin(lat) ** 2); lat = Math.atan2(Z2 + e2 * Ni * Math.sin(lat), pp); }
      return [lat / rad, Math.atan2(Y2, X2) / rad];
    }

    themDongVn();

    // Địa chỉ <-> tọa độ, miễn phí, không cần API key: Photon (komoot, dữ liệu OSM), dự phòng Nominatim.
    // Dữ liệu OSM ở Việt Nam hầu như chưa có số nhà, nên kết quả chính xác tới tên đường + phường.
    const VN_BBOX = '102,8,110,24';
    const veMang = async (url, ms = 15000) => {
      const ctl = new AbortController(); const h = setTimeout(() => ctl.abort(), ms);
      try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
      finally { clearTimeout(h); }
    };
    const laHem = n => /^(hẻm|ngõ|ngách|kiệt|hxh)\b/i.test(n || '');
    const ghepDiaChi = (so, duong, phuong, tp) => {
      const p = phuong ? (/^(phường|xã|đặc khu|thị trấn)/i.test(phuong) ? phuong : 'phường ' + phuong) : '';
      return [[so, duong].filter(Boolean).join(' '), p, tp].filter(Boolean).join(', ');
    };
    function khoangCachDoan(lat, lon, a, b) {
      const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
      const ax = (a.lon - lon) * kx, ay = (a.lat - lat) * ky, bx = (b.lon - lon) * kx, by = (b.lat - lat) * ky;
      const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
      const t = L2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L2)) : 0;
      return Math.hypot(ax + t * dx, ay + t * dy);
    }
    async function duongGanNhat(lat, lon) {
      // Overpass trả hình học đường nên biết chính xác đường nào gần điểm nhất (ưu tiên đường chính hơn hẻm).
      // Gọi nhanh một lần (8 giây/máy chủ, tối đa 2 máy chủ), không dùng vòng thử lại dài của phần tiện ích.
      const q = `[out:json][timeout:8];way(around:80,${lat},${lon})[highway][name];out geom tags;`;
      let d = null;
      for (const ep of OVERPASS_EPS.slice(0, 2)) {
        const ctl = new AbortController(); const h = setTimeout(() => ctl.abort(), 8000);
        try { const r = await fetch(ep, { method: 'POST', body: new URLSearchParams({ data: q }), signal: ctl.signal }); if (r.ok) { d = await r.json(); break; } }
        catch (e) { /* thử máy chủ kế */ } finally { clearTimeout(h); }
      }
      if (!d) return null;
      let best = null;
      for (const w of d.elements || []) {
        const g = w.geometry || []; let m = Infinity;
        for (let i = 1; i < g.length; i++) m = Math.min(m, khoangCachDoan(lat, lon, g[i - 1], g[i]));
        const ten = (w.tags && (w.tags['name:vi'] || w.tags.name)) || '';
        const diem = m + (laHem(ten) ? 40 : 0);
        if (!best || diem < best.diem) best = { ten, diem };
      }
      return best && best.ten;
    }
    async function diaChiTuToaDo(lat, lon) {
      let phuong = '', tp = '', duong = '', so = '';
      try {
        const j = await veMang(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}&limit=8&radius=0.15&lang=default`);
        const fs = (j.features || []).map(f => f.properties);
        if (fs[0]) { phuong = fs[0].district || ''; tp = fs[0].city || fs[0].state || ''; }
        const coSo = fs.find(p => p.housenumber && p.street);
        if (coSo) { so = coSo.housenumber; duong = coSo.street; }
        const dg = fs.find(p => p.osm_key === 'highway' && p.name && !laHem(p.name)) || fs.find(p => p.osm_key === 'highway' && p.name);
        if (!duong && dg) duong = dg.name;
      } catch (e) {
        const j = await veMang(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&accept-language=vi`);
        const a = j.address || {};
        so = a.house_number || ''; duong = a.road || ''; phuong = a.quarter || a.suburb || a.city_district || ''; tp = a.city || a.state || '';
      }
      return { so, duong, phuong, tp };
    }
    async function toaDoTuDiaChi(q) {
      const tsbd = document.getElementById('tsbd').value.split(',').map(Number);
      const [blat, blon] = tsbd.length === 2 && tsbd.every(isFinite) && tsbd[0] ? tsbd : [10.78, 106.69];
      try {
        const j = await veMang(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${blat}&lon=${blon}&bbox=${VN_BBOX}&limit=1&lang=default`);
        const f = (j.features || [])[0];
        if (f) return { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], coSo: !!f.properties.housenumber };
      } catch (e) { /* thử Nominatim */ }
      const j = await veMang(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=vn&limit=1&accept-language=vi&q=${encodeURIComponent(q)}`);
      if (j[0]) return { lat: Number(j[0].lat), lon: Number(j[0].lon), coSo: j[0].addresstype === 'house' || j[0].type === 'house' };
      return null;
    }
    const daTraDiaChi = {};
    async function capNhatDiaChi(k) {
      const v = document.getElementById(k).value.trim(), o = document.getElementById(k + '-dc');
      if (!v) { o.value = ''; delete daTraDiaChi[k]; return; }
      const [lat, lon] = v.split(',').map(Number);
      if (!isFinite(lat) || !isFinite(lon) || daTraDiaChi[k] === v) return;
      daTraDiaChi[k] = v; o.value = 'Đang tra địa chỉ...';
      let a;
      try { a = await diaChiTuToaDo(lat, lon); o.value = ghepDiaChi(a.so, a.duong, a.phuong, a.tp) || 'Không tìm thấy địa chỉ'; }
      catch (e) { o.value = 'Không tra được địa chỉ (máy chủ bận)'; delete daTraDiaChi[k]; return; }
      if (a.so) return;
      // Tinh chỉnh tên đường bằng hình học đường thật (Overpass); bận thì giữ kết quả Photon.
      const duong = await duongGanNhat(lat, lon).catch(() => null);
      if (duong && duong !== a.duong && daTraDiaChi[k] === v && document.activeElement !== o) o.value = ghepDiaChi('', duong, a.phuong, a.tp);
    }
    async function timTheoDiaChi(k) {

        const r = await toaDoTuDiaChi(q);
        if (!r) { alert('Không tìm thấy địa chỉ này trên OpenStreetMap.'); return; }
        const v = `${r.lat.toFixed(6)}, ${r.lon.toFixed(6)}`;
        document.getElementById(k).value = v; daTraDiaChi[k] = v;
        updateMarkers();
        if (info && !r.coSo) info.textContent = 'Lưu ý: OSM chưa có số nhà này, tọa độ đang lấy theo tên đường. Kiểm tra lại vị trí trên bản đồ.';
      } catch (e) { alert('Máy chủ tìm địa chỉ bận, thử lại sau ít phút.'); }
      finally { o.disabled = false; }
    }
    document.querySelectorAll('[data-tim]').forEach(b => b.onclick = () => timTheoDiaChi(b.dataset.tim));
    ['tsbd', 'tsss1', 'tsss2', 'tsss3'].forEach(k => {
      document.getElementById(k + '-dc').addEventListener('keydown', e => { if (e.key === 'Enter') timTheoDiaChi(k); });
      // Gõ/dán tọa độ là bản đồ tự cập nhật (trước đây phải bấm Cập nhật nên dễ tưởng là hỏng).
      const o = document.getElementById(k);

    // Ô địa chỉ mặc định ẩn cho gọn; bấm 📍 để hiện/ẩn từng ô, trang nhớ lựa chọn.
    function hienDiaChi(k, hien) {

    document.querySelectorAll('[data-dc]').forEach(b => {
      const k = b.dataset.dc;
      hienDiaChi(k, nho('dc-' + k) === '1');
      b.onclick = () => { const hien = document.getElementById(k + '-dong-dc').hidden; nho('dc-' + k, hien ? '1' : '0'); hienDiaChi(k, hien); };

    function takeScreenshot() {

    // Các loại tiện ích chính
    // Mỗi loại tiện ích = một hàm lọc trên phần tử OSM (đã tải MỘT lần cho cả bán kính).
    const laTen = (t, re) => re.test((t.name || '') + ' ' + (t['name:vi'] || ''));
    const KHONG_PHAI_TRUONG = /(anh ngữ|ngoại ngữ|tiếng anh|tiếng trung|language|english|trung tâm|center|lái xe)/i;
    const amenityTypes = [
      { id: 'school', label: 'Trường', loai: [
          { ten: 'Trường', khop: t => ['school','college','university','kindergarten'].includes(t.amenity) || t.building === 'school', boQua: t => laTen(t, KHONG_PHAI_TRUONG) }
      ] },
      { id: 'hospital', label: 'Bệnh viện', loai: [
          { ten: 'Bệnh viện', khop: t => t.amenity === 'hospital' || t.healthcare === 'hospital' },
          { ten: 'Phòng khám', khop: t => t.amenity === 'clinic' || t.healthcare === 'clinic' }
      ] },
      { id: 'bus_station', label: 'Bến xe', loai: [
          { ten: 'Bến xe', khop: t => t.amenity === 'bus_station' || (t.public_transport === 'station' && t.bus === 'yes') },
          { ten: 'Trạm xe buýt', khop: t => t.highway === 'bus_stop' || (t.public_transport === 'platform' && t.bus !== 'no') }
      ], gopKetQua: true },
      { id: 'market', label: 'Chợ/Cửa hàng', loai: [
          { ten: 'Chợ', khop: t => t.amenity === 'marketplace' || laTen(t, /^chợ\s/i) },
          { ten: 'Cửa hàng', khop: t => ['convenience','supermarket','mall','department_store'].includes(t.shop) }
      ], gopKetQua: true }
    ];
    const LOAI_KHAC = [
      { ten: 'UBND', khop: t => t.amenity === 'townhall' || laTen(t, /(ủy ban|uỷ ban|ubnd)/i) },
      { ten: 'Công an', khop: t => t.amenity === 'police' },
      { ten: 'Công viên', khop: t => t.leisure === 'park' && laTen(t, /\S/) },
      { ten: 'Sân vận động', khop: t => t.leisure === 'stadium' },
      { ten: 'Di tích', khop: t => ['monument','memorial','castle','heritage','temple','archaeological_site'].includes(t.historic) }
    ];
    let currentRadiusKm = 1;

    document.addEventListener('DOMContentLoaded', () => {
      const radiusDisplay = document.getElementById('radius-display');
      const radiusDecrease = document.getElementById('radius-decrease');
      const radiusIncrease = document.getElementById('radius-increase');

      if (radiusDisplay) radiusDisplay.innerText = currentRadiusKm;

      if (radiusIncrease) {
        radiusIncrease.addEventListener('click', () => {
          currentRadiusKm += 1;
          radiusDisplay.innerText = currentRadiusKm;
        });
      }
      if (radiusDecrease) {
        radiusDecrease.addEventListener('click', () => {
          if (currentRadiusKm > 1) {

            radiusDisplay.innerText = currentRadiusKm;

    // Hàm chung: tìm gần nhất cho 1 tập queries (node + way + relation)
    // Gọi Overpass có dự phòng: thử lần lượt nhiều máy chủ, POST (tránh URL quá dài), thử lại khi 429/504, nghỉ giữa các lần gọi.
    const OVERPASS_EPS = [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.private.coffee/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
    ];
    const nghi = ms => new Promise(r => setTimeout(r, ms));
    let lanGoiCuoi = 0;
    async function goiOverpass(query) {
      let loiCuoi = null;
      for (let vong = 0; vong < 2; vong++) {
        for (const ep of OVERPASS_EPS) {
          const cho = 1200 - (Date.now() - lanGoiCuoi);
          if (cho > 0) await nghi(cho);
          lanGoiCuoi = Date.now();
          const ctl = new AbortController();
          const hen = setTimeout(() => ctl.abort(), 30000);
          try {
            const r = await fetch(ep, { method: 'POST', body: new URLSearchParams({ data: query }), signal: ctl.signal });
            clearTimeout(hen);
            if (r.ok) { const d = await r.json(); if (d && Array.isArray(d.elements)) return d; }
            loiCuoi = new Error('Overpass ' + r.status);
            if (r.status === 429) await nghi(3000);
          } catch (e) { clearTimeout(hen); loiCuoi = e; }
        }
      }
      throw loiCuoi || new Error('Overpass không phản hồi');
    }

    // Tải MỘT lần mọi phần tử tiện ích trong bán kính (thay vì 15–20 truy vấn rời gây quá tải/lỗi).
    let boNhoTienIch = { khoa: '', ds: [] };
    async function taiTienIch(lat, lon) {
      const R = Math.round(currentRadiusKm * 1000);
      const khoa = `${lat.toFixed(5)},${lon.toFixed(5)},${R}`;
      if (boNhoTienIch.khoa === khoa) return boNhoTienIch.ds;
      const a = `(around:${R},${lat},${lon})`;
      const q = `[out:json][timeout:60];(
        nwr${a}["amenity"~"^(school|college|university|kindergarten|hospital|clinic|bus_station|marketplace|townhall|police)$"];
        nwr${a}["healthcare"~"^(hospital|clinic)$"];
        nwr${a}["building"="school"]["name"];
        nwr${a}["highway"="bus_stop"];
        nwr${a}["public_transport"~"^(platform|station)$"];
        nwr${a}["shop"~"^(convenience|supermarket|mall|department_store)$"];
        nwr${a}["office"="government"]["name"];
        nwr${a}["leisure"~"^(park|stadium)$"];
        nwr${a}["historic"~"^(monument|memorial|castle|heritage|temple|archaeological_site)$"];
      );out center tags;`;
      const data = await goiOverpass(q);
      const ds = [];
      for (const e of data.elements || []) {
        const la = typeof e.lat === 'number' ? e.lat : e.center && e.center.lat;
        const lo = typeof e.lon === 'number' ? e.lon : e.center && e.center.lon;
        if (typeof la !== 'number' || typeof lo !== 'number') continue;
        const t = e.tags || {};
        ds.push({ lat: la, lon: lo, t, name: t['name:vi'] || t.name || '', dist: calculateDistance(lat, lon, la, lo) });
      }
      boNhoTienIch = { khoa, ds };
      return ds;
    }
    function ganNhat(ds, loai) {
      let best = null;
      for (const x of ds) {
        if (!loai.khop(x.t) || (loai.boQua && loai.boQua(x.t))) continue;
        const d = Number(x.dist);
        if (!best || d < Number(best.dist)) best = x;
      }
      return best;
    }
    const tenHien = x => (x.name && x.name.trim()) ? x.name : '(không tên)';
    function xoaMarkerTienIch() {
      [...amenityTypes.map(a => `amenity-${a.id}`), 'amenity-other'].forEach(k => {
        if (markers[k]) { map.removeLayer(markers[k]); delete markers[k]; }
      });
    }
    function datMarker(key, x, nhan) {
      createMarker(key, x.lat, x.lon, nhan, 'pngtree-circular-world-flag-vietnam-icon-png-image_4830539.png');
    }

    async function searchAmenities() {
      const tsbdValue = document.getElementById('tsbd').value;
      if (!tsbdValue) { alert('Vui lòng nhập tọa độ TSBĐ trước khi kiểm tra tiện ích.'); return; }
      const [lat, lon] = tsbdValue.split(',').map(Number);
      const infoDiv = document.getElementById('amenities-info');
      if (infoDiv) infoDiv.textContent = `Đang tìm tiện ích trong phạm vi ${currentRadiusKm} km...`;
      xoaMarkerTienIch();
      let ds;
      try { ds = await taiTienIch(lat, lon); }
      catch (err) {
        console.error('Overpass lỗi', err);
        [...amenityTypes.map(a => `amenity-${a.id}`), 'amenity-other'].forEach(id => {
          const el = document.getElementById(id); if (el) el.value = `${el.value.split(':')[0]}: Máy chủ dữ liệu bận, bấm Kiểm tra lại sau ít phút`;
        });
        if (infoDiv) infoDiv.textContent = 'Không tải được dữ liệu tiện ích (Overpass bận).';
        return;
      }
      for (const amenity of amenityTypes) {
        const el = document.getElementById(`amenity-${amenity.id}`);
        const tim = amenity.loai.map(l => ({ l, x: ganNhat(ds, l) })).filter(o => o.x);
        if (!tim.length) { if (el) el.value = `${amenity.label}: Không tìm thấy trong phạm vi ${currentRadiusKm} km`; continue; }
        if (amenity.gopKetQua) {
          // Hiện cả hai (ví dụ Chợ + Cửa hàng, Bến xe + Trạm buýt); marker ở cái gần nhất.
          const gan = tim.slice().sort((a, b) => a.x.dist - b.x.dist)[0];
          datMarker(`amenity-${amenity.id}`, gan.x, gan.l.ten);
          if (el) el.value = tim.map(o => `${o.l.ten}: ${tenHien(o.x)} (${o.x.dist} km)`).join(' · ');
        } else {
          const o = tim[0];
          datMarker(`amenity-${amenity.id}`, o.x, o.l.ten);
          if (el) el.value = `${o.l.ten}: ${tenHien(o.x)} (${o.x.dist} km)`;
        }
      }
      const elKhac = document.getElementById('amenity-other');
      let daCo = false;
      for (const l of LOAI_KHAC) {
        const x = ganNhat(ds, l);
        if (x) { datMarker('amenity-other', x, l.ten); if (elKhac) elKhac.value = `Khác (${l.ten}): ${tenHien(x)} (${x.dist} km)`; daCo = true; break; }
      }
      if (!daCo && elKhac) elKhac.value = `Khác: Không tìm thấy trong phạm vi ${currentRadiusKm} km`;
      if (infoDiv) infoDiv.textContent = `Đã kiểm tra tiện ích trong phạm vi ${currentRadiusKm} km (${ds.length} điểm OSM).`;
    }
  </script>
</body>
</html>
